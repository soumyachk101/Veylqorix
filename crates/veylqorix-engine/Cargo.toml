[package]
name = "veylqorix-engine"
version = "0.1.0"
# Internal, per-scan subprocess of the TypeScript core — never a crates.io
# artifact.
publish = false
edition = "2021"
license = "MIT"
description = "Veylqorix security engine: deterministic policy evaluation, gate decision, exit-code mapping, and the offline secret scanner, exposed over a bounded JSON stdio protocol."

# The engine is a per-scan subprocess spawned by the TypeScript core; keep it
# dependency-light and fast to build. All dependencies are pure Rust.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# `sha1` is built on `digest`; name the trait explicitly so the hash call is
# stable across versions.
sha1 = "0.10"
digest = "0.10"
# Unix process-group control so a timed-out tool's whole process tree (e.g.
# `cargo audit` spawning a `git fetch`) is killed together and cannot hold the
# output pipes open past the timeout.
[target."cfg(unix)".dependencies]
libc = "0.2"

[dev-dependencies]
# Integration tests exercise the binary through its stdio protocol.
tempfile = "3"

[lib]
name = "veylqorix_engine"
