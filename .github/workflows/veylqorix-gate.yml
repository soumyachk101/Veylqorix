# Veylqorix reusable security gate.
#
# Reusable workflow: a calling repo invokes this with `uses:` and controls the
# scan root, whether to run the test suite, and the severities that block.
#
# ENFORCEMENT: this workflow does NOT block merges by itself. It only ENFORCES
# when the calling repo requires this workflow's status check via branch
# protection or a ruleset. Until that is configured, the gate is advisory.

name: Veylqorix Gate

on:
  workflow_call:
    inputs:
      root:
        description: "Path to scan, relative to the repo root."
        required: false
        type: string
        default: "."
      run-tests:
        description: "Run the test/build quality checks as part of the scan."
        required: false
        type: boolean
        default: false
      block-on:
        description: "Comma-separated severities that block the gate."
        required: false
        type: string
        default: "HIGH,CRITICAL"

# Least privilege: read the content, write to code-scanning (SARIF upload).
# No secrets are forwarded to the called workflow.
permissions:
  contents: read
  security-events: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout calling repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "20"
          cache: pnpm

      # (b) Obtain a usable Veylqorix CLI.
      #
      # If the calling repo is this monorepo (apps/cli present at the root),
      # build the CLI from source. Otherwise the CLI must be installed from
      # the registry. Until @veylqorix/cli is published, a non-monorepo
      # caller cannot run the scan; we fail loudly instead of pretending.
      - name: Prepare Veylqorix CLI
        id: prepare
        run: |
          set -u
          if [ -d "apps/cli" ]; then
            echo "Built-in monorepo detected; building CLI from source."
            pnpm install --frozen-lockfile
            pnpm build
            echo "cli-src=true" >> "$GITHUB_OUTPUT"
            echo "monorepo=true" >> "$GITHUB_OUTPUT"
          elif command -v veylqorix >/dev/null 2>&1; then
            echo "Global veylqorix CLI found."
            echo "cli-src=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::@veylqorix/cli is not available in this calling repo. Install it (npm i -g @veylqorix/cli once published) or run the gate inside the Veylqorix monorepo."
            echo "cli-src=false" >> "$GITHUB_OUTPUT"
          fi

      # (b2) Rust security engine (monorepo branch only).
      #
      # When the CLI is built from this monorepo, its engine adapter looks for
      # the release binary at crates/target/release/veylqorix-engine, so it
      # must be built before the scan below. If the binary is missing during a
      # scan the engine is a SKIPPED scanner result in the response, never a
      # non-zero exit.
      #
      # `dtolnay/rust-toolchain` installs the Rust toolchain via rustup. Pinned
      # to the commit that the `v1` tag resolves to (verified against the
      # action's tagged commit on GitHub).
      - name: Set up Rust toolchain (stable)
        if: steps.prepare.outputs.monorepo == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Build Rust engine (release)
        if: steps.prepare.outputs.monorepo == 'true'
        run: cargo build --manifest-path crates/Cargo.toml --workspace --release

      # (c) Run the scan, capturing the exit code.
      #
      # One authoritative scan feeds every report format: a single CLI
      # invocation renders JSON (stdout), Markdown, and SARIF from the same
      # audit result via the shared `renderAllReports` path in @veylqorix/core
      # (file writers live in apps/cli and delegate to it). The gate never
      # runs a second scan to keep a stdout stream clean. The exit code of
      # this run drives the gate; report-generation failure exits 70 and fails
      # this step, so a promised artifact is never silently missing.
      - name: Run Veylqorix scan
        id: scan
        if: steps.prepare.outputs.cli-src == 'true'
        run: |
          set -u
          no_tests="--no-tests"
          if [ "${{ inputs.run-tests }}" = "true" ]; then
            no_tests=""
          fi
          cli="node apps/cli/dist/index.js"
          if [ ! -d "apps/cli" ]; then cli="veylqorix"; fi
          # shellcheck disable=SC2086
          set +e
          "$cli" scan --root "${{ inputs.root }}" --block-on "${{ inputs.block-on }}" \
            $no_tests --json --report-out veylqorix.md --sarif-out veylqorix.sarif \
            > veylqorix.json 2> veylqorix.stderr
          code=$?
          set -euo pipefail
          echo "exit=${code}" >> "$GITHUB_OUTPUT"
          echo "Scan exit code: ${code}"
          if [ ! -s veylqorix.sarif ]; then
            echo "::error::SARIF artifact veylqorix.sarif was not produced by the scan step (CLI exit code ${code}). The report path failed; see veylqorix.json / veylqorix.stderr for context. The gate cannot be green."
            exit 70
          fi

      # (d) Preserve the raw scan output and report artifacts on success AND
      # on failure. When the scan step hard-failed, some files may be
      # missing; `if-no-files-found: ignore` uploads what exists without
      # failing this step on an empty match. A missing SARIF is already a
      # visible `::error` from the scan step.
      - name: Upload Veylqorix scan artifacts
        if: steps.prepare.outputs.cli-src == 'true' && (failure() || !cancelled())
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: veylqorix-scan
          path: |
            veylqorix.json
            veylqorix.md
            veylqorix.sarif
            veylqorix.stderr
          if-no-files-found: ignore

      # (d2) Verify the SARIF before posting it. A valid 2.1.0 document with at
      # least one run is required by code scanning; anything else fails here
      # with explicit context instead of reaching the upload as a misleading
      # success. (Mirrors `validateSarifFile` in @veylqorix/core, which the
      # unit tests in tests/report-gate.test.ts exercise directly.)
      - name: Validate SARIF artifact
        if: steps.prepare.outputs.cli-src == 'true' && hashFiles('veylqorix.sarif') != ''
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const doc = JSON.parse(fs.readFileSync("veylqorix.sarif", "utf8"));
            if (doc.version !== "2.1.0") {
              throw new Error("SARIF artifact has version " + JSON.stringify(doc.version) + "; expected 2.1.0. Refusing to upload.");
            }
            if (!Array.isArray(doc.runs) || doc.runs.length === 0) {
              throw new Error("SARIF artifact has no runs; a code-scanning upload would post nothing. Refusing.");
            }
            console.log("SARIF artifact is a valid 2.1.0 document (" + doc.runs[0].results.length + " result(s)); posting to code scanning.");
          '

      # (d3) Upload the SARIF produced by the same scan to GitHub code
      # scanning. An upload failure here (missing security-events permission,
      # code scanning disabled, ...) fails this step red — it is never
      # reported as a successful upload.
      - name: Upload SARIF to code scanning
        if: steps.prepare.outputs.cli-src == 'true' && hashFiles('veylqorix.sarif') != ''
        uses: github/codeql-action/upload-sarif@4e828ff8d448a8a6e532957b1811f387a63867e8 # v3.29.4
        with:
          sarif_file: veylqorix.sarif

      # (e) Distinct failure handling so INCOMPLETE is never silently green.
      #
      # When no usable CLI is available (`cli-src == false`), the gate cannot
      # be evaluated at all: fail with a distinct message instead of letting
      # the skipped steps leave the check green.
      - name: Evaluate gate result
        if: steps.prepare.outputs.cli-src == 'true' || !cancelled()
        run: |
          set -u
          if [ "${{ steps.prepare.outputs.cli-src }}" != "true" ]; then
            echo "Gate: NO-SCAN - no usable Veylqorix CLI in this calling repo; the gate cannot pass without a scan."
            exit 70
          fi
          code="${{ steps.scan.outputs.exit }}"
          case "${code}" in
            0)
              echo "Gate: PASS"
              ;;
            1)
              echo "Gate: FAIL - blocking findings present. The scan exits 1."
              exit 1
              ;;
            2)
              # INCOMPLETE: the scanner could not fully run. Never treat as
              # green; fail with a distinct message.
              echo "Gate: INCOMPLETE - the scanner could not run to completion. Failing so this is never silently green."
              exit 2
              ;;
            70)
              echo "Gate: REPORT-ERROR - the scan process hit an unexpected error (exit 70). See veylqorix.stderr for context."
              exit 70
              ;;
            *)
              echo "Gate: UNEXPECTED exit code ${code}."
              exit "${code}"
              ;;
          esac
