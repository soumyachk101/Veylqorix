# Veylqorix release publishing (OPT-IN, trusted publishing only).
#
# This workflow publishes @veylqorix/core and @veylqorix/cli to npm. It is
# intentionally inert until the owner completes one-time npm-side setup:
# the GitHub App + OIDC trusted-publisher registration described in
# docs/engineering/RELEASE_READINESS.md ("Owner setup for trusted publishing").
#
# Safety properties (by design):
# - Runs ONLY when the owner pushes a git tag matching `v*`.
# - No secrets of its own: authentication is via GitHub's OIDC token, which
#   npm accepts only for a package whose trusted-publisher was configured
#   for this exact workflow + tag subject. Unconfigured, the publish step
#   fails closed — nothing is ever published untrusted.
# - No commit/branch/tag push, no write permissions; read-only checkout.
# - No `npm login` / NPM_TOKEN secret path: provenance replaces it.
#
# Publishing order matters: the CLI's dependency range on @veylqorix/core
# must resolve on the registry, so core is always published first.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      - name: Pack packages
        run: |
          set -euo pipefail
          mkdir -p artifacts
          (cd packages/core && npm pack --pack-destination ../../artifacts)
          (cd apps/cli && npm pack --pack-destination ../../artifacts)
          ls -l artifacts

      - name: Publish to npm (OIDC provenance; fails until owner setup is complete)
        run: |
          set -euo pipefail
          core_tgz="$(ls artifacts/veylqorix-core-*.tgz)"
          cli_tgz="$(ls artifacts/veylqorix-cli-*.tgz)"
          # Provenance ties the tarball to this exact commit + workflow; no
          # token secret is involved.
          npm publish "$core_tgz" --provenance --access public
          npm publish "$cli_tgz" --provenance --access public
