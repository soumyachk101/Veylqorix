# Veylqorix release publishing (OPT-IN, trusted publishing only).
#
# This workflow publishes @veylqorix/core and @veylqorix/cli to npm. It is
# intentionally inert until the owner completes one-time npm-side setup:
# the trusted-publisher registration (npm's Publish settings, per package)
# described in
# docs/engineering/NPM_TRUSTED_PUBLISHING_SETUP.md.
#
# Two-job structure (least privilege + explicit fail-safe ordering):
# - Job `pack`: read-only. Checks out, builds, and packs both tarballs,
#   then uploads them. It requests no id-token and no write permission.
# - Job `publish`: needs `pack`. Downloads the tarballs and runs
#   `npm publish` with `--provenance`. Only this job requests
#   `id-token: write`, because that OIDC token is what the provenance
#   attestation and the trusted-publisher check consume.
#
# Safety properties (by design):
# - Runs ONLY when the owner pushes a git tag matching `v*`.
# - No secrets of its own: authentication is via GitHub's OIDC token, which
#   npm accepts only for a package whose trusted-publisher was configured
#   for this exact workflow + tag subject. Until the owner registers
#   trusted publishers for BOTH packages on npm, the publish steps fail
#   closed with HTTP 401/403 — nothing is ever published untrusted.
#   See docs/engineering/NPM_TRUSTED_PUBLISHING_SETUP.md.
# - A duplicate or already-published version fails transparently with an
#   HTTP 403 duplicate-publish error; it is not retried or masked.
# - Tag/version guard: the pack job verifies the pushed tag matches the
#   version declared in BOTH package manifests and fails loudly if they
#   disagree. A version once published is immutable on npm, so a bad tag
#   cannot be fixed by re-tagging — it must be caught before publish.
# - Provenance ties each tarball to this exact commit and this workflow.
# - No commit/branch/tag push, no write permissions; read-only checkout.
# - No `npm login` / NPM_TOKEN secret path: provenance replaces it.
#
# Publishing order matters: the CLI's dependency range on @veylqorix/core
# must resolve on the registry, so core is always published first. Each
# publish step starts with `set -euo pipefail`, so a failing core publish
# prevents the CLI step from running.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: "11.9.0"

      - name: Set up Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Verify tag matches manifest versions
        run: |
          set -euo pipefail
          # Fail loudly if the pushed tag disagrees with what the manifests
          # declare. npm versions are immutable once published, so a wrong
          # tag can never be fixed by re-tagging.
          node <<'EOF'
          const fs = require("fs");

          function fail(message) {
            console.error("::error::" + message);
            process.exit(1);
          }

          const tag = process.env.GITHUB_REF_NAME;
          const tagPattern = /^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/;
          if (!tagPattern.test(tag)) {
            fail(
              "Tag " + tag +
              " does not match the expected v<major>.<minor>.<patch>[-prerelease] pattern"
            );
          }

          const expected = tag.slice(1); // strip leading "v"
          const manifests = [
            "packages/core/package.json",
            "apps/cli/package.json",
          ];
          for (const manifest of manifests) {
            const version = JSON.parse(
              fs.readFileSync(manifest, "utf8")
            ).version;
            if (typeof version !== "string" || version === "") {
              fail("Tag " + tag + " is present but " + manifest + " declares no version");
            }
            if (version !== expected) {
              fail(
                "Tag " + tag + " (version " + expected +
                ") does not match " + manifest + " version " + version
              );
            }
          }
          console.log("Tag " + tag + " matches both manifest versions (" + expected + ")");
          EOF

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages to publish
        run: |
          set -euo pipefail
          pnpm --filter @veylqorix/core build
          pnpm --filter @veylqorix/cli build

      - name: Pack packages
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # `pnpm pack` (not `npm pack`) rewrites the CLI's `workspace:*`
          # dependency on @veylqorix/core to the concrete local version
          # (0.1.0) in the tarball's package.json. `npm pack` would ship
          # the `workspace:` protocol verbatim, which is unresolvable on
          # the registry and would make the published CLI uninstallable.
          pnpm --filter @veylqorix/core pack --pack-destination ./artifacts
          pnpm --filter @veylqorix/cli  pack --pack-destination ./artifacts
          ls -l artifacts

      - name: Upload packed tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packaged-tarballs
          path: artifacts

  publish:
    runs-on: ubuntu-latest
    needs: pack
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "24"

      - name: Download packed tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packaged-tarballs

      - name: Publish @veylqorix/core
        run: |
          set -euo pipefail
          core_tgz="$(ls packaged-tarballs/veylqorix-core-*.tgz)"
          # Provenance ties this tarball to this exact commit + workflow;
          # no token secret is involved.
          # A duplicate publish is rejected by npm with HTTP 403
          # EPUBLISHCONFLICT. Each step runs under `set -euo pipefail`, so
          # that failure stops the workflow — it is not retried or skipped.
          npm publish "$core_tgz" --provenance --access public

      - name: Publish @veylqorix/cli
        run: |
          set -euo pipefail
          cli_tgz="$(ls packaged-tarballs/veylqorix-cli-*.tgz)"
          npm publish "$cli_tgz" --provenance --access public
