<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6A768C"/>
    </marker>
    <marker id="arrL" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9B84F3"/>
    </marker>
  </defs>
  <rect width="1280" height="560" fill="#FBFAF7"/>
  <g font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14">
    <g>
      <rect x="48" y="34" width="34" height="34" rx="8" fill="#44CDBB"/>
      <rect x="62" y="44" width="34" height="34" rx="8" fill="#9B84F3" opacity="0.92"/>
      <rect x="55" y="70" width="20" height="20" rx="5" fill="#E3BE45"/>
      <text x="118" y="60" font-size="28" font-weight="700" fill="#17213A">VEYLQORIX</text>
      <text x="118" y="80" font-size="12" fill="#5A6B85">No Unsafe Code Gets Through.</text>
      <line x1="350" y1="42" x2="350" y2="86" stroke="#D6DAE4" stroke-width="2"/>
      <text x="376" y="60" font-size="24" font-weight="700" fill="#17213A">AI agent integration model</text>
      <text x="376" y="82" font-size="14" fill="#5A6B85">one security engine, multiple entry points</text>
    </g>

    <!-- agents -->
    <rect x="60" y="130" width="240" height="92" rx="12" fill="#DDF7F3" stroke="#44CDBB" stroke-width="1.6"/>
    <text x="180" y="162" font-size="15" font-weight="700" fill="#17213A" text-anchor="middle">AI coding agents</text>
    <text x="180" y="184" font-size="12.5" fill="#46536A" text-anchor="middle">Claude Code · OpenAI Codex · Cursor</text>
    <text x="180" y="204" font-size="12.5" fill="#46536A" text-anchor="middle">other MCP-compatible agents</text>

    <!-- surfaces cluster -->
    <rect x="360" y="120" width="330" height="230" rx="14" fill="none" stroke="#9B84F3" stroke-width="1.4"/>
    <text x="380" y="146" font-size="12" font-weight="700" fill="#4E4673" letter-spacing="1.5">SUPPORTED INTEGRATION SURFACES</text>
    <rect x="380" y="158" width="290" height="70" rx="12" fill="#F0EBFF" stroke="#9B84F3" stroke-width="1.6"/>
    <text x="525" y="186" font-size="14" font-weight="700" fill="#17213A" text-anchor="middle">Portable skill</text>
    <text x="525" y="208" font-size="12.5" fill="#46536A" text-anchor="middle">workflow instructions · evidence rules</text>
    <line x1="525" y1="228" x2="525" y2="248" stroke="#9B84F3" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrL)"/>
    <rect x="380" y="252" width="290" height="82" rx="12" fill="#F0EBFF" stroke="#9B84F3" stroke-width="1.6"/>
    <text x="525" y="282" font-size="14" font-weight="700" fill="#17213A" text-anchor="middle">MCP server</text>
    <text x="525" y="304" font-size="12.5" fill="#46536A" text-anchor="middle">validated tools · structured results</text>
    <text x="525" y="322" font-size="11.5" fill="#5A6B85" text-anchor="middle">scan · findings · policy · remediation</text>

    <!-- CLI local path -->
    <rect x="360" y="392" width="330" height="70" rx="12" fill="#FFF3C8" stroke="#E3BE45" stroke-width="1.6"/>
    <text x="525" y="420" font-size="14" font-weight="700" fill="#17213A" text-anchor="middle">Veylqorix CLI</text>
    <text x="525" y="442" font-size="12.5" fill="#46536A" text-anchor="middle">local use · automation · git hooks</text>

    <!-- engine -->
    <rect x="740" y="176" width="280" height="120" rx="14" fill="#D7F7F0" stroke="#3BC9B7" stroke-width="2.4"/>
    <text x="880" y="214" font-size="15" font-weight="700" fill="#17213A" text-anchor="middle">Shared Rust core</text>
    <text x="880" y="238" font-size="12.5" fill="#46536A" text-anchor="middle">same scanner orchestration</text>
    <text x="880" y="258" font-size="12.5" fill="#46536A" text-anchor="middle">same policy evaluation</text>
    <text x="880" y="278" font-size="12.5" fill="#46536A" text-anchor="middle">no duplicated security rules</text>

    <!-- findings -->
    <rect x="1040" y="146" width="200" height="92" rx="12" fill="#F0EBFF" stroke="#9B84F3" stroke-width="1.6"/>
    <text x="1140" y="178" font-size="14" font-weight="700" fill="#17213A" text-anchor="middle">Normalized findings</text>
    <text x="1140" y="200" font-size="12.5" fill="#46536A" text-anchor="middle">severity · redacted evidence</text>
    <text x="1140" y="218" font-size="12.5" fill="#46536A" text-anchor="middle">remediation · stable ids</text>

    <!-- reports/dashboard -->
    <rect x="1040" y="262" width="200" height="92" rx="12" fill="#FFF3C8" stroke="#E3BE45" stroke-width="1.6"/>
    <text x="1140" y="294" font-size="14" font-weight="700" fill="#17213A" text-anchor="middle">Reports &amp; dashboard</text>
    <text x="1140" y="316" font-size="12.5" fill="#46536A" text-anchor="middle">JSON · SARIF · Markdown</text>
    <text x="1140" y="334" font-size="12.5" fill="#46536A" text-anchor="middle">scan status · history · findings</text>

    <!-- arrows -->
    <line x1="300" y1="176" x2="360" y2="176" stroke="#6A768C" stroke-width="2" marker-end="url(#arr)"/>
    <polyline points="300,196 300,312 360,312" fill="none" stroke="#6A768C" stroke-width="2" marker-end="url(#arr)"/>
    <polyline points="300,216 300,427 360,427" fill="none" stroke="#6A768C" stroke-width="2" marker-end="url(#arr)"/>
    <text x="308" y="404" font-size="12" fill="#46536A">local workflow</text>

    <line x1="670" y1="293" x2="740" y2="250" stroke="#6A768C" stroke-width="2" marker-end="url(#arr)"/>
    <polyline points="670,427 670,340 740,258" fill="none" stroke="#6A768C" stroke-width="2" marker-end="url(#arr)"/>

    <line x1="1020" y1="214" x2="1040" y2="192" stroke="#6A768C" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="1140" y1="238" x2="1140" y2="262" stroke="#6A768C" stroke-width="2" marker-end="url(#arr)"/>

    <!-- plugin note -->
    <rect x="60" y="480" width="560" height="52" rx="10" fill="none" stroke="#D6DAE4" stroke-width="1.4"/>
    <text x="80" y="502" font-size="12.5" fill="#5A6B85">Scanner extensions (@veylqorix/plugin) plug custom checks into the same engine —</text>
    <text x="80" y="520" font-size="12.5" fill="#5A6B85">they extend coverage; they are not an AI-agent host surface.</text>
  </g>
</svg>
