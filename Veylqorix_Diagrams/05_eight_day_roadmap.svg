    <rect x="712" y="354" width="250" height="100" rx="12" fill="#D7F7F0" stroke="#3BC9B7" stroke-width="1.6"/>
    <text x="837" y="384" font-size="15" font-weight="700" fill="#17213A" text-anchor="middle">DAY 7</text>
    <text x="837" y="408" font-size="12.5" fill="#46536A" text-anchor="middle">Integration hardening</text>
