<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6A768C"/>
    </marker>
    <marker id="arrL" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9B84F3"/>
    </marker>
  </defs>
  <rect width="1200" height="960" fill="#FBFAF7"/>
  <g font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14">
    <g>
      <rect x="48" y="34" width="34" height="34" rx="8" fill="#44CDBB"/>
      <rect x="62" y="44" width="34" height="34" rx="8" fill="#9B84F3" opacity="0.92"/>
      <rect x="55" y="70" width="20" height="20" rx="5" fill="#E3BE45"/>
      <text x="118" y="60" font-size="30" font-weight="700" fill="#17213A">VEYLQORIX</text>
      <text x="118" y="82" font-size="13" fill="#5A6B85">No Unsafe Code Gets Through.</text>
      <line x1="360" y1="42" x2="360" y2="86" stroke="#D6DAE4" stroke-width="2"/>
      <text x="392" y="60" font-size="26" font-weight="700" fill="#17213A">Security scan lifecycle</text>
      <text x="392" y="84" font-size="15" fill="#5A6B85">From code change to evidence-backed decision</text>
    </g>

    <!-- steps 1-4 -->
    <rect x="60" y="130" width="255" height="86" rx="12" fill="#DDF7F3" stroke="#44CDBB" stroke-width="1.6"/>
    <text x="187" y="162" font-size="14" font-weight="700" fill="#17213A" text-anchor="middle">1. Code change</text>
    <text x="187" y="184" font-size="12.5" fill="#46536A" text-anchor="middle">working tree · staged diff · PR</text>
    <text x="187" y="202" font-size="12.5" fill="#46536A" text-anchor="middle">(or a registered repo root)</text>

    <line x1="315" y1="173" x2="335" y2="173" stroke="#6A768C" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="341" y="130" width="255" height="86" rx="12" fill="#DDF7F3" stroke="#44CDBB" stroke-width="1.6"/>
    <text x="468" y="162" font-size="14" font-weight="700" fill="#17213A" text-anchor="middle">2. Detect project</text>
    <text x="468" y="184" font-size="12.5" fill="#46536A" text-anchor="middle">languages · manifests · lockfiles</text>
    <text x="468" y="202" font-size="12.5" fill="#46536A" text-anchor="middle">gate which scanners apply</text>

    <line x1="596" y1="173" x2="616" y2="173" stroke="#6A768C" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="622" y="130" width="255" height="86" rx="12" fill="#D7F7F0" stroke="#3BC9B7" stroke-width="1.6"/>
    <text x="749" y="162" font-size="14" font-weight="700" fill="#17213A" text-anchor="middle">3. Run applicable scanners</text>
    <text x="749" y="184" font-size="12.5" fill="#46536A" text-anchor="middle">deps · secrets · quality · SAST</text>
    <text x="749" y="202" font-size="12.5" fill="#46536A" text-anchor="middle">missing tool ⇒ SKIPPED, not pass</text>

    <line x1="877" y1="173" x2="897" y2="173" stroke="#6A768C" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="903" y="130" width="237" height="86" rx="12" fill="#D7F7F0" stroke="#3BC9B7" stroke-width="1.6"/>
    <text x="1021" y="162" font-size="14" font-weight="700" fill="#17213A" text-anchor="middle">4. Normalize findings</text>
    <text x="1021" y="184" font-size="12.5" fill="#46536A" text-anchor="middle">severity · file/line</text>
    <text x="1021" y="202" font-size="12.5" fill="#46536A" text-anchor="middle">redacted evidence · stable ids</text>

    <!-- 5. policy diamond -->
    <line x1="600" y1="216" x2="600" y2="300" stroke="#6A768C" stroke-width="2" marker-end="url(#arr)"/>
    <polygon points="600,300 760,382 600,464 440,382" fill="#FFF3C8" stroke="#E3BE45" stroke-width="2"/>
    <text x="600" y="372" font-size="15" font-weight="700" fill="#17213A" text-anchor="middle">5. Policy</text>
    <text x="600" y="392" font-size="15" font-weight="700" fill="#17213A" text-anchor="middle">evaluation</text>
    <text x="600" y="412" font-size="12.5" fill="#46536A" text-anchor="middle">thresholds · exceptions</text>

    <line x1="440" y1="382" x2="330" y2="382" stroke="#6A768C" stroke-width="2" marker-end="url(#arr)"/>
    <text x="384" y="368" font-size="12.5" fill="#256344" text-anchor="middle">meets policy</text>
    <rect x="80" y="340" width="250" height="84" rx="12" fill="#DFF5E8" stroke="#58B98A" stroke-width="1.8"/>
    <text x="205" y="372" font-size="14" font-weight="700" fill="#17213A" text-anchor="middle">PASS</text>
    <text x="205" y="394" font-size="12.5" fill="#46536A" text-anchor="middle">exit 0 · eligible to merge</text>
    <text x="205" y="412" font-size="12.5" fill="#46536A" text-anchor="middle">when required checks pass</text>

    <line x1="760" y1="382" x2="870" y2="382" stroke="#6A768C" stroke-width="2" marker-end="url(#arr)"/>
    <text x="816" y="368" font-size="12.5" fill="#8A3545" text-anchor="middle">violates policy</text>
    <rect x="870" y="340" width="270" height="84" rx="12" fill="#FBE4E8" stroke="#EF8B9B" stroke-width="1.8"/>
    <text x="1005" y="372" font-size="14" font-weight="700" fill="#17213A" text-anchor="middle">BLOCK / FAIL · exit 1</text>
    <text x="1005" y="394" font-size="12.5" fill="#46536A" text-anchor="middle">blocking finding or</text>
    <text x="1005" y="412" font-size="12.5" fill="#46536A" text-anchor="middle">required scanner error</text>

    <text x="1005" y="446" font-size="12.5" fill="#46536A" text-anchor="middle">INCOMPLETE · exit 2 when coverage is limited</text>

    <!-- 6. report -->
    <line x1="205" y1="424" x2="205" y2="520" stroke="#6A768C" stroke-width="2"/>
    <line x1="1005" y1="424" x2="1005" y2="520" stroke="#6A768C" stroke-width="2"/>
    <line x1="205" y1="520" x2="1005" y2="520" stroke="#6A768C" stroke-width="2"/>
    <line x1="600" y1="520" x2="600" y2="540" stroke="#6A768C" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="420" y="546" width="360" height="86" rx="12" fill="#F0EBFF" stroke="#9B84F3" stroke-width="1.6"/>
    <text x="600" y="578" font-size="14" font-weight="700" fill="#17213A" text-anchor="middle">6. Report results</text>
    <text x="600" y="600" font-size="12.5" fill="#46536A" text-anchor="middle">JSON · SARIF · Markdown, from one scan</text>
    <text x="600" y="618" font-size="12.5" fill="#46536A" text-anchor="middle">API + dashboard persist the outcome</text>

    <!-- 7/8 remediation loop -->
    <line x1="600" y1="632" x2="600" y2="676" stroke="#9B84F3" stroke-width="2" marker-end="url(#arrL)"/>
    <rect x="380" y="682" width="440" height="86" rx="12" fill="#F0EBFF" stroke="#9B84F3" stroke-width="1.6"/>
    <text x="600" y="714" font-size="14" font-weight="700" fill="#17213A" text-anchor="middle">7. Targeted remediation</text>
    <text x="600" y="736" font-size="12.5" fill="#46536A" text-anchor="middle">developer / agent proposes a minimal fix</text>
    <text x="600" y="754" font-size="12.5" fill="#46536A" text-anchor="middle">secrets: rotate first, then remove</text>

    <line x1="600" y1="768" x2="600" y2="812" stroke="#9B84F3" stroke-width="2" marker-end="url(#arrL)"/>
    <rect x="380" y="818" width="440" height="86" rx="12" fill="#D7F7F0" stroke="#3BC9B7" stroke-width="1.6"/>
    <text x="600" y="850" font-size="14" font-weight="700" fill="#17213A" text-anchor="middle">8. Rescan &amp; verify</text>
    <text x="600" y="872" font-size="12.5" fill="#46536A" text-anchor="middle">re-run; confirm finding ids are gone</text>
    <text x="600" y="890" font-size="12.5" fill="#46536A" text-anchor="middle">fix only counts when verified</text>

    <path d="M 820 861 L 820 828 L 1150 828 L 1150 400 L 1046 382" fill="none" stroke="#9B84F3" stroke-width="2" marker-end="url(#arrL)"/>
    <text x="1160" y="610" font-size="12.5" fill="#4E4673" text-anchor="middle" transform="rotate(90 1160 610)">verification loop</text>

    <!-- footer note -->
    <text x="60" y="936" font-size="12.5" fill="#5A6B85">API persistence: in-flight scans are re-stamped INTERRUPTED on restart — a recoverable state, never a completed scan.</text>
  </g>
</svg>
