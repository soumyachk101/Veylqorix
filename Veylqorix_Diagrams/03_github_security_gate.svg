<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1280" viewBox="0 0 900 1280">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6A768C"/>
    </marker>
  </defs>
  <rect width="900" height="1280" fill="#FBFAF7"/>
  <g font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14">
    <g>
      <rect x="48" y="34" width="34" height="34" rx="8" fill="#44CDBB"/>
      <rect x="62" y="44" width="34" height="34" rx="8" fill="#9B84F3" opacity="0.92"/>
      <rect x="55" y="70" width="20" height="20" rx="5" fill="#E3BE45"/>
      <text x="118" y="60" font-size="28" font-weight="700" fill="#17213A">VEYLQORIX</text>
      <text x="118" y="80" font-size="12" fill="#5A6B85">No Unsafe Code Gets Through.</text>
      <line x1="330" y1="42" x2="330" y2="86" stroke="#D6DAE4" stroke-width="2"/>
      <text x="356" y="58" font-size="22" font-weight="700" fill="#17213A">GitHub pull-request security gate</text>
      <text x="356" y="80" font-size="13" fill="#5A6B85">CI enforcement is independent of local hooks</text>
    </g>

    <rect x="330" y="130" width="240" height="76" rx="12" fill="#DDF7F3" stroke="#44CDBB" stroke-width="1.6"/>
    <text x="450" y="160" font-size="14" font-weight="700" fill="#17213A" text-anchor="middle">Developer / AI agent</text>
    <text x="450" y="182" font-size="12.5" fill="#46536A" text-anchor="middle">changes code locally</text>

    <line x1="450" y1="206" x2="450" y2="248" stroke="#6A768C" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="300" y="254" width="300" height="96" rx="12" fill="#F0EBFF" stroke="#9B84F3" stroke-width="1.6"/>
    <text x="450" y="284" font-size="14" font-weight="700" fill="#17213A" text-anchor="middle">Local CLI + git hook</text>
    <text x="450" y="306" font-size="12.5" fill="#46536A" text-anchor="middle">fast feedback before push</text>
    <text x="450" y="326" font-size="12.5" fill="#46536A" text-anchor="middle">convenience layer — can be bypassed</text>

    <line x1="450" y1="350" x2="450" y2="392" stroke="#6A768C" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="330" y="398" width="240" height="76" rx="12" fill="#DDF7F3" stroke="#44CDBB" stroke-width="1.6"/>
    <text x="450" y="430" font-size="14" font-weight="700" fill="#17213A" text-anchor="middle">Push branch / open PR</text>
    <text x="450" y="452" font-size="12.5" fill="#46536A" text-anchor="middle">reusable workflow via uses:</text>
    <text x="450" y="468" font-size="12.5" fill="#46536A" text-anchor="middle">root · run-tests · block-on</text>

    <line x1="450" y1="474" x2="450" y2="516" stroke="#6A768C" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="270" y="522" width="360" height="96" rx="12" fill="#D7F7F0" stroke="#3BC9B7" stroke-width="2.2"/>
    <text x="450" y="554" font-size="14" font-weight="700" fill="#17213A" text-anchor="middle">GitHub Actions workflow</text>
    <text x="450" y="576" font-size="12.5" fill="#46536A" text-anchor="middle">pinned actions · least-privilege permissions</text>
    <text x="450" y="596" font-size="12.5" fill="#46536A" text-anchor="middle">contents: read · security-events: write</text>
    <text x="450" y="612" font-size="11.5" fill="#5A6B85" text-anchor="middle">no secrets forwarded to the called workflow</text>

    <line x1="450" y1="618" x2="450" y2="660" stroke="#6A768C" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="270" y="666" width="360" height="96" rx="12" fill="#D7F7F0" stroke="#3BC9B7" stroke-width="1.6"/>
    <text x="450" y="698" font-size="14" font-weight="700" fill="#17213A" text-anchor="middle">Run required checks</text>
    <text x="450" y="720" font-size="12.5" fill="#46536A" text-anchor="middle">one authoritative scan; tests optional</text>
    <text x="450" y="740" font-size="12.5" fill="#46536A" text-anchor="middle">inputs validated before use, never interpolated</text>
    <text x="450" y="756" font-size="11.5" fill="#5A6B85" text-anchor="middle">default block-on: HIGH, CRITICAL</text>

    <line x1="450" y1="762" x2="450" y2="820" stroke="#6A768C" stroke-width="2" marker-end="url(#arr)"/>
    <polygon points="450,820 585,888 450,956 315,888" fill="#FFF3C8" stroke="#E3BE45" stroke-width="2"/>
    <text x="450" y="878" font-size="14" font-weight="700" fill="#17213A" text-anchor="middle">Policy</text>
    <text x="450" y="898" font-size="14" font-weight="700" fill="#17213A" text-anchor="middle">passes?</text>

    <line x1="315" y1="888" x2="250" y2="888" stroke="#6A768C" stroke-width="2" marker-end="url(#arr)"/>
    <text x="283" y="874" font-size="12.5" fill="#256344" text-anchor="middle">yes</text>
    <rect x="60" y="856" width="190" height="96" rx="12" fill="#DFF5E8" stroke="#58B98A" stroke-width="1.8"/>
    <text x="155" y="886" font-size="13.5" font-weight="700" fill="#17213A" text-anchor="middle">Required check: PASS</text>
    <text x="155" y="908" font-size="11.5" fill="#46536A" text-anchor="middle">eligible to merge if all</text>
    <text x="155" y="924" font-size="11.5" fill="#46536A" text-anchor="middle">other repository rules pass</text>

    <line x1="585" y1="888" x2="650" y2="888" stroke="#6A768C" stroke-width="2" marker-end="url(#arr)"/>
    <text x="646" y="872" font-size="12.5" fill="#8A3545" text-anchor="end">no / error</text>
    <rect x="650" y="856" width="190" height="96" rx="12" fill="#FBE4E8" stroke="#EF8B9B" stroke-width="1.8"/>
    <text x="745" y="886" font-size="13.5" font-weight="700" fill="#17213A" text-anchor="middle">Required check: FAIL</text>
    <text x="745" y="908" font-size="11.5" fill="#46536A" text-anchor="middle">blocks merge only when</text>
    <text x="745" y="924" font-size="11.5" fill="#46536A" text-anchor="middle">repo rules require it</text>

    <line x1="155" y1="952" x2="155" y2="1030" stroke="#6A768C" stroke-width="2"/>
    <line x1="745" y1="952" x2="745" y2="1030" stroke="#6A768C" stroke-width="2"/>
    <line x1="155" y1="1030" x2="745" y2="1030" stroke="#6A768C" stroke-width="2"/>
    <line x1="450" y1="1030" x2="450" y2="1050" stroke="#6A768C" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="290" y="1056" width="320" height="96" rx="12" fill="#F0EBFF" stroke="#9B84F3" stroke-width="1.6"/>
    <text x="450" y="1086" font-size="14" font-weight="700" fill="#17213A" text-anchor="middle">Publish safe results</text>
    <text x="450" y="1108" font-size="12.5" fill="#46536A" text-anchor="middle">JSON / SARIF / Markdown · on pass and fail</text>
    <text x="450" y="1128" font-size="12.5" fill="#46536A" text-anchor="middle">SARIF validated, then posted to code scanning</text>
    <text x="450" y="1144" font-size="11.5" fill="#5A6B85" text-anchor="middle">a missing SARIF fails the gate loudly</text>

    <rect x="240" y="1186" width="420" height="56" rx="10" fill="none" stroke="#D6DAE4" stroke-width="1.4"/>
    <text x="450" y="1210" font-size="12.5" fill="#5A6B85" text-anchor="middle">The gate is advisory until a calling repo requires</text>
    <text x="450" y="1228" font-size="12.5" fill="#5A6B85" text-anchor="middle">its status check via branch protection or a ruleset</text>
  </g>
</svg>
