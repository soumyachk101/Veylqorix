  <script>
    const tl = gsap.timeline({ paused: true });
    // the card performs in: a restrained pixel-style reveal — it lands a touch large and
    // settles (dead still afterwards), while its four "scan" bands resolve top to bottom
    const card = document.getElementById("s7-card");
    const logo = document.getElementById("s7-logo");
    const cw = logo.naturalWidth || 560;
    const ch = logo.naturalHeight || 190;
    const bands = [];
    for (let i = 0; i < 4; i++) {
      const cv = document.createElement("canvas");
      cv.width = cw;
      cv.height = Math.ceil(ch / 4);
      const ctx = cv.getContext("2d");
      ctx.drawImage(logo, 0, i * (ch / 4), cw, ch / 4, 0, 0, cw, ch / 4);
      const im = new Image();
      im.src = cv.toDataURL("image/png");
      im.alt = "";
      im.draggable = false;
      im.style.cssText =
        "position:absolute;left:0;width:100%;opacity:0;top:" + (i * 25).toFixed(2) + "%;height:25%;";
      logo.style.cssText += "position:relative;height:" + ch + "px;overflow:hidden;";
      logo.appendChild(im);
      bands.push(im);
    }
    tl.set(logo, { opacity: 0 }, 0);
    // card lands slightly large and settles
    tl.fromTo(card, { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.7, ease: "expo.out", transformOrigin: "center" }, 1.05);
    // pixel bands resolve across the lockup
    bands.forEach((b, i) => {
      tl.fromTo(b, { opacity: 0, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.28, ease: "power3.out" }, 1.35 + i * 0.09);
    });
    // fragments settle around it
    tl.fromTo("#s7-frag .f", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.2)", transformOrigin: "center", stagger: 0.09 }, 0.4);
    // a quiet camera drift so the hold still feels alive
    tl.to("#s7-card", { y: -6, duration: 4, ease: "power1.inOut" }, 3.0);
    // the tagline row under the lockup
    tl.fromTo("#s7-tag", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 2.6);
    // final pixel line
    tl.fromTo("#s7-final", { opacity: 0, filter: "blur(5px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, 5.6);
    tl.fromTo("#s7-tl", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 6.3);
    tl.fromTo("#s7-br", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 6.3);

    window.__timelines["s7"] = tl;
