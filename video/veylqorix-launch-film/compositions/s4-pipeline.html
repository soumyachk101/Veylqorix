  <script>
    const tl = gsap.timeline({ paused: true });
    // grid drifts (camera)
    tl.fromTo("#s4-grid", { x: 0 }, { x: -48, duration: 11.9, ease: "power1.inOut" }, 0);

    // type the command: deterministic char reveal
    const cmd = "veylqorix scan . --json";
    const cmdEl = document.getElementById("s4-cmdtext");
    const spans = [];
    for (let i = 0; i < cmd.length; i++) {
      const s = document.createElement("span");
      s.textContent = cmd[i];
      s.style.opacity = "0";
      cmdEl.appendChild(s);
      spans.push(s);
    }
    tl.set("#s4-caret", { opacity: 1 }, 0.25);
    tl.to("#s4-caret", { opacity: 0, duration: 0.12, repeat: 9, yoyo: true, ease: "steps(1)" }, 0.3);
    spans.forEach((s, i) => {
      tl.to(s, { opacity: 1, duration: 0.04 }, 0.35 + i * 0.055);
    });
    // findings line appears
    tl.fromTo("#s4-out", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 1.6);

    // stage activation: cards rise, dot lights, contents fill
    const stages = ["#s4-st1", "#s4-st2", "#s4-st3", "#s4-st4", "#s4-st5"];
    const dots = [
      document.querySelector("#s4-st1 .s4-dot"),
      document.querySelector("#s4-st2 .s4-dot"),
      document.querySelector("#s4-st3 .s4-dot"),
      document.querySelector("#s4-st4 .s4-dot"),
      document.querySelector("#s4-st5 .s4-dot"),
    ];
    // base: all start hidden
    tl.set(stages, { opacity: 0, y: 26 }, 0);
    function stageIn(id, dot, t) {
      tl.to(id, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, t);
      tl.to(dot, { backgroundColor: "#14b3ad", boxShadow: "0 0 14px rgba(20,179,173,0.7)", duration: 0.15, ease: "power2.out" }, t + 0.35);
    }
    stageIn("#s4-st1", dots[0], 2.45);
    stageIn("#s4-st2", dots[1], 2.75);
    stageIn("#s4-st3", dots[2], 4.65);
    stageIn("#s4-st4", dots[3], 4.95);
    stageIn("#s4-st5", dots[4], 6.85);
    // scanner chips inside stage 3
    tl.fromTo("#s4-st3 .sc", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out", stagger: 0.09 }, 5.0);
    // redaction reveal
    tl.fromTo("#s4-redact", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 5.5);

    // the three words: land dead-still, hold, blur-out
    function wordIn(id, tIn, tOut) {
      tl.fromTo(id, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power4.out" }, tIn);
      tl.to(id, { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in" }, tOut);
    }
    wordIn("#s4-w1", 2.3, 4.1);
    wordIn("#s4-w2", 4.5, 6.3);
    wordIn("#s4-w3", 6.7, 8.8);

    // outcome chips pop in (fail first, then the pass that carries the gate)
    tl.fromTo("#s4-resfail", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.4)", transformOrigin: "center" }, 7.55);
    tl.fromTo("#s4-respass", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.4)", transformOrigin: "center" }, 7.95);
    // the pass chip gets a one-time glow pulse (no loop)
    tl.fromTo("#s4-respass", { boxShadow: "4px 4px 0 rgba(0,0,0,0.3)" }, { boxShadow: "0 0 34px rgba(111,233,226,0.45)", duration: 0.5, ease: "power2.out" }, 8.3);

    // hold the complete system, drift gently
    tl.to("#s4-pipe", { x: -24, duration: 3.4, ease: "power1.inOut" }, 8.8);

    // dip cut into the next world
    tl.to("#s4-dip", { opacity: 1, duration: 0.5, ease: "power2.in" }, 11.5);
    window.__timelines["s4"] = tl;
  </script>
